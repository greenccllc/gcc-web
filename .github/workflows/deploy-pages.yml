name: deploy-pages
# Publish the public marketing surface of greencommllc.com to Cloudflare Pages
# on every push to main. IIS still serves the gated portal shells
# (admin.*, admin-api.*, chat.* on greencommllc.com) via the tunnel, so this
# workflow does NOT touch anything on gcc-svr-web.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'db/**'
      - 'docs/**'
      - 'repos/**'
      - 'admin/**'
      - 'clients/**'
      - 'ops/**'
      - 'AGENTS.md'
      - 'CHANGELOG.md'
      - 'VERSION'
      - 'web.config'
      - 'publish.ps1'
      - '_migrate.py'
      - '.gitignore'
  workflow_dispatch: {}

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assemble public-only deployment package
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out

          # Include only truly-public content. The gated portal shells
          # (admin/, clients/, ops/, staff/, ai-proposals.html) stay behind
          # the tunnel on IIS and are not shipped to the always-up edge.
          cp -r \
            index.html \
            about.html \
            contact.html \
            projects.html \
            services.html \
            styleguide.html \
            support.html \
            404.html \
            robots.txt \
            sitemap.xml \
            services \
            tools \
            estimate \
            legal \
            assets \
            gcc-brand \
            marketing \
            out/ 2>/dev/null || true

          # phone.greencommllc.com stays on IIS for the APK distribution
          # (>25 MiB Pages limit). Do NOT copy phone/ here.

          # _redirects — mirrors the historic URL redirects from web.config.
          cat > out/_redirects <<'EOR'
          /staff/*                        /admin/:splat        301
          /estimator.html                 /estimate/commercial.html         301
          /estimator-residential.html     /estimate/residential.html        301
          /privacy.html                   /legal/privacy.html               301
          /terms.html                     /legal/terms.html                 301
          /quickbooks.html                /support.html#quickbooks          301
          /manager.html                   /admin/                           301
          EOR

          # _headers — mirrors the security headers from web.config outboundRules.
          cat > out/_headers <<'EOH'
          /*
            Strict-Transport-Security: max-age=31536000; includeSubDomains
            X-Content-Type-Options: nosniff
            Referrer-Policy: strict-origin-when-cross-origin
          EOH

          echo "Bundle contents:"
          find out -maxdepth 2 -type f | sort
          echo ""
          du -sh out

      - name: Deploy to Cloudflare Pages (gcc-site)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy out \
            --project-name=gcc-site \
            --branch=main \
            --commit-hash=${{ github.sha }} \
            --commit-message="${{ github.event.head_commit.message || 'workflow_dispatch' }}"
